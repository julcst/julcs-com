name: Render CV

on:
  push:
    paths:
      - "_CV.yaml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Render CV
        run: |
          uvx --with "rendercv[full]" rendercv render _CV.yaml
          # RenderCV creates a folder named 'rendercv_output'
          # We need to find the generated .md and .pdf files
          mkdir -p public/
          mkdir -p src/content/pages/
          cp rendercv_output/Julian_C._Stamm_CV.pdf public/cv.pdf
          cp rendercv_output/Julian_C._Stamm_CV.md src/content/pages/cv.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: updated cv.pdf via build script"
          file_pattern: "public/cv.pdf src/content/pages/cv.md"
